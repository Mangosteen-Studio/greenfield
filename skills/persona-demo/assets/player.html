<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Persona Demo</title>
<style>
:root{--paper:#f5f3ed;--ink:#182e29;--muted:#5c6d66;--line:#d4dbd2;--green:#dbf090;--orange:#f0a875}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:16px/1.5 -apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}button,input,a{font:inherit}button{cursor:pointer;color:inherit;background:transparent;border:1px solid var(--line);border-radius:8px;min-height:44px;padding:9px 15px}button:hover{background:#e6ebdf}button:disabled{opacity:.4;cursor:default}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid #a85120;outline-offset:4px}[hidden]{display:none!important}header{padding:23px 4vw;display:flex;justify-content:space-between;align-items:center;border-bottom:1px solid var(--line);gap:20px}.brand{font-weight:750;letter-spacing:-.8px;font-size:23px}.brand span{color:#7b8c58}.label{font-size:11px;text-transform:uppercase;letter-spacing:1.7px;font-weight:700}.scenario{font-size:12px;color:var(--muted);max-width:500px;text-align:right}.layout{display:grid;grid-template-columns:245px 1fr;max-width:1500px;margin:0 auto;min-height:calc(100vh - 88px)}aside{padding:36px 28px;border-right:1px solid var(--line)}.person{display:flex;align-items:center;gap:12px;margin-bottom:28px}.avatar{width:44px;height:44px;display:grid;place-items:center;border-radius:50%;background:var(--orange);font-family:Georgia,serif;font-size:26px}.role{font-size:12px;color:var(--muted)}nav{display:grid;gap:8px;margin-top:18px}nav button{text-align:left;border:0;display:flex;align-items:center;gap:12px;font-size:13px}nav button[aria-current="step"]{background:var(--ink);color:var(--paper)}.num{font-size:11px;opacity:.7}.aside-note{font-size:12px;color:var(--muted);margin-top:28px}main{min-width:0;padding:42px 4vw 24px}.intro{display:flex;justify-content:space-between;align-items:center;gap:15px;color:var(--muted)}h1{font-family:Georgia,"Times New Roman",serif;font-size:clamp(32px,3.6vw,53px);letter-spacing:-1.8px;line-height:1.09;max-width:820px;font-weight:400;margin:20px 0 14px}.body{font-size:17px;color:var(--muted);max-width:740px;min-height:50px;margin-bottom:25px}.workspace{background:var(--ink);border-radius:15px;padding:24px;color:#f5f3ed;min-height:275px;overflow:hidden}.workspace-top{display:flex;justify-content:space-between;align-items:center;gap:15px;padding-bottom:21px;border-bottom:1px solid #476057;font-size:12px}.dots{color:var(--green);letter-spacing:4px}.cards{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:13px;padding-top:24px}.card{background:#284039;border:1px solid #4a6254;border-radius:10px;padding:19px;min-width:0}.card:first-child{background:var(--green);color:var(--ink);border-color:var(--green)}.card .label{font-size:10px;letter-spacing:1.3px}.value{font-size:clamp(21px,2vw,29px);line-height:1.17;letter-spacing:-.7px;margin:21px 0 12px;overflow-wrap:anywhere}.detail{font-size:13px;opacity:.86}.capture{width:100%;max-height:380px;object-fit:contain;margin-top:20px;border-radius:8px}.choices{display:flex;flex-wrap:wrap;gap:8px;margin-top:18px}.choices button{background:#284039;color:#f5f3ed;border-color:#708077}.choices button[aria-pressed="true"]{background:var(--green);color:var(--ink)}.result{margin:13px 0 0;font-size:14px}.question{margin:22px 0;font-size:16px;min-height:24px}.question:before{content:'↳ ';color:#7d4b20}.transport{display:flex;align-items:center;gap:9px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:18px}.primary{background:var(--ink);color:var(--paper);border-color:var(--ink)}.primary:hover{background:#335145}.time{font-size:12px;color:var(--muted);min-width:64px;text-align:right;font-variant-numeric:tabular-nums}.scrub{flex:1;min-width:100px;accent-color:var(--ink);height:32px}.settings{display:flex;justify-content:space-between;align-items:center;gap:15px;flex-wrap:wrap;margin-top:16px;font-size:12px;color:var(--muted)}.settings label{display:flex;gap:8px;align-items:center;min-height:40px}.settings input{accent-color:var(--ink);width:18px;height:18px}.settings button{font-size:12px}.notes{margin-top:14px;background:#ece5d7;padding:18px;border-radius:8px;font-size:14px;white-space:pre-wrap}.cta{display:inline-block;color:var(--ink);margin:15px 0;font-weight:600}.caption{font-size:13px;color:var(--muted);margin-top:18px;max-width:780px}.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)}@media(max-width:800px){header{padding:16px 20px;align-items:flex-start}.scenario{max-width:210px;font-size:10px}.layout{display:block}aside{padding:18px 20px;border-right:0;border-bottom:1px solid var(--line)}.person{margin-bottom:12px}nav{display:flex;overflow-x:auto;gap:6px;margin:0;padding:4px 0}nav button{white-space:nowrap;flex-shrink:0}.aside-note,aside>.label{display:none}main{padding:26px 20px}.body{min-height:0}h1{font-size:38px}.cards{grid-template-columns:1fr}.workspace{padding:18px}.card{padding:16px}.value{margin:12px 0 8px}.transport{gap:7px}.scrub{flex-basis:50%}}
</style></head><body>
<header><div class="brand" id="product"></div><div class="scenario" id="scenario"></div></header>
<div class="layout"><aside><div class="person"><div class="avatar" id="avatar"></div><div><strong id="person"></strong><div class="role" id="role"></div></div></div><div class="label">One moment. A different day.</div><nav aria-label="Story chapters" id="chapters"></nav><p class="aside-note">Explore at your pace.<br>Follow one case from question to next step.</p></aside>
<main><div class="intro"><span class="label" id="chapter"></span><span class="label" id="count"></span></div><h1 id="headline" tabindex="-1"></h1><p class="body" id="body"></p>
<section class="workspace" aria-label="Scenario workspace"><div class="workspace-top"><span id="visual"></span><span class="dots" aria-hidden="true">● ● ●</span></div><img class="capture" id="capture" alt="" hidden><div class="cards" id="cards"></div><div class="choices" id="choices" aria-label="Explore a decision"></div><p class="result" id="result" aria-live="polite" hidden></p></section>
<p class="question" id="question"></p><a class="cta" id="cta" hidden rel="noopener noreferrer"></a>
<div class="transport"><button id="prev" aria-label="Previous chapter">←</button><button id="play" class="primary">Play</button><button id="replay">Replay</button><label class="sr" for="scrub">Scene time</label><input class="scrub" id="scrub" type="range" min="0" step="0.05" value="0"><span class="time" id="time"></span><button id="next" aria-label="Next chapter">Next →</button></div>
<div class="settings"><label><input type="checkbox" id="reduced">Reduce motion</label><span id="hint">← → chapters · Space play / pause</span><button id="notesToggle" hidden aria-expanded="false">Presenter notes</button></div><p class="caption" id="caption"></p><div class="notes" id="notes" hidden></div><div class="sr" id="status" aria-live="polite"></div></main></div>
<script type="application/json" id="demo-data">__DEMO_DATA__</script>
<script>
'use strict';
const demo=JSON.parse(document.getElementById('demo-data').textContent), $=id=>document.getElementById(id);
const set=(id,text)=>$(id).textContent=text;
let index=0,t=0,playing=false,last=null,choice=0,objects=[];
const preference=matchMedia('(prefers-reduced-motion: reduce)');$('reduced').checked=preference.matches;
document.title=demo.title;set('product',demo.product+' / a working day');set('scenario',demo.scenarioLabel);set('person',demo.persona.name);set('role',demo.persona.role);set('avatar',demo.persona.name.slice(0,1));
demo.scenes.forEach((scene,i)=>{const b=document.createElement('button');b.type='button';const n=document.createElement('span');n.className='num';n.textContent=String(i+1).padStart(2,'0');b.append(n,document.createTextNode(scene.chapter));b.onclick=()=>{playing=false;enter(i,true)};$('chapters').append(b)});
function selectChoice(n){choice=n;const s=demo.scenes[index];if(!s.choices)return;set('result',s.choices[n].result);[...$('choices').children].forEach((b,i)=>b.setAttribute('aria-pressed',String(i===n)))}
function enter(n,focus=false){index=n;t=0;last=null;const s=demo.scenes[n];choice=s.defaultChoice||0;set('chapter',s.chapter);set('count',String(n+1).padStart(2,'0')+' / '+String(demo.scenes.length).padStart(2,'0'));set('headline',s.headline);set('body',s.body);set('visual',s.visualLabel);set('question',s.question);set('caption',s.narration);$('scrub').max=s.seconds;
 $('cards').replaceChildren();objects=[];s.cards.forEach(card=>{const el=document.createElement('article');el.className='card';[['label',card.label],['value',card.value],['detail',card.detail]].forEach(([cls,text])=>{const p=document.createElement('div');p.className=cls;p.textContent=text;el.append(p)});$('cards').append(el);objects.push(el)});
 $('capture').hidden=!s.image;if(s.image){$('capture').src=s.image;$('capture').alt=s.imageAlt}else{$('capture').removeAttribute('src')}
 $('choices').replaceChildren();$('result').hidden=!s.choices;if(s.choices){s.choices.forEach((c,i)=>{const b=document.createElement('button');b.textContent=c.label;b.type='button';b.onclick=()=>{playing=false;selectChoice(i);renderAt(t)};$('choices').append(b)});selectChoice(choice)}
 [...$('chapters').children].forEach((b,i)=>{if(i===n)b.setAttribute('aria-current','step');else b.removeAttribute('aria-current')});$('prev').disabled=n===0;$('next').disabled=n===demo.scenes.length-1;
 $('notesToggle').hidden=!demo.presenter;set('notes',s.notes||'');$('cta').hidden=!(demo.cta&&n===demo.scenes.length-1);if(demo.cta){$('cta').textContent=demo.cta.label;$('cta').href=demo.cta.url}set('status','Chapter '+(n+1)+': '+s.chapter);renderAt(0);if(focus)$('headline').focus();}
function renderAt(seconds){const s=demo.scenes[index];t=Math.max(0,Math.min(s.seconds,seconds));const reduced=$('reduced').checked;objects.forEach((el,i)=>{const p=reduced?1:Math.min(1,Math.max(0,(t-i*.24)/.65));const eased=1-Math.pow(1-p,3);el.style.opacity=String(.7+.3*eased);el.style.transform='translateY('+(12*(1-eased))+'px)'});$('scrub').value=t;set('time',t.toFixed(1)+' / '+s.seconds+'s');set('play',playing?'Pause':'Play');$('play').setAttribute('aria-label',playing?'Pause story':'Play story');}
function togglePlay(){if(!playing&&t>=demo.scenes[index].seconds){if(index===demo.scenes.length-1)enter(0);else enter(index+1)}playing=!playing;last=null;renderAt(t)}
$('play').onclick=togglePlay;$('prev').onclick=()=>{if(index>0){playing=false;enter(index-1,true)}};$('next').onclick=()=>{if(index<demo.scenes.length-1){playing=false;enter(index+1,true)}};$('replay').onclick=()=>{playing=true;enter(index)};$('scrub').oninput=()=>{playing=false;renderAt(Number($('scrub').value))};$('reduced').onchange=()=>renderAt(t);preference.addEventListener('change',e=>{$('reduced').checked=e.matches;renderAt(t)});
$('notesToggle').onclick=()=>{$('notes').hidden=!$('notes').hidden;$('notesToggle').setAttribute('aria-expanded',String(!$('notes').hidden))};
document.addEventListener('keydown',e=>{if(e.altKey||e.ctrlKey||e.metaKey||['INPUT','TEXTAREA','SELECT'].includes(e.target.tagName)||e.target.isContentEditable)return;if(e.code==='Space'&&e.target.tagName!=='BUTTON'&&e.target.tagName!=='A'){e.preventDefault();togglePlay()}else if(e.key==='ArrowRight'){e.preventDefault();$('next').click()}else if(e.key==='ArrowLeft'){e.preventDefault();$('prev').click()}else if(e.key==='Home'||e.key==='End'){e.preventDefault();playing=false;enter(e.key==='Home'?0:demo.scenes.length-1,true)}});
document.addEventListener('visibilitychange',()=>{if(document.hidden){playing=false;last=null;renderAt(t)}});
function tick(now){if(playing){const delta=last===null?0:(now-last)/1000;renderAt(t+delta);if(t>=demo.scenes[index].seconds){if(index<demo.scenes.length-1)enter(index+1);else{playing=false;renderAt(t)}}}last=now;requestAnimationFrame(tick)}
enter(0);requestAnimationFrame(tick);
</script></body></html>
